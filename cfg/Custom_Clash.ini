ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
;以上兜底规则会根据实际情况随时取消
;ruleset=🔀 非标端口,clash-classic:https://raw.githubusercontent.com/AceDylan/Custom_OpenClash_Rules/main/rule/Custom_Port_Direct.yaml,28800
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位结束

;设置节点分组标志位
;本段由私有仓库 openclash-ops 的 tools/render_ini.py 按 topology.yaml 生成，请勿手改。
;应用层：只由人手动选择出口
custom_proxy_group=💬 社交媒体`select`[]🇸🇬 新加坡出口`[]🇯🇵 日本出口`[]🇺🇸 美国出口`[]🇭🇰 香港出口`[]🎯 全球直连`[]🧭 全部节点
custom_proxy_group=🎥 流媒体`select`[]🇸🇬 新加坡出口`[]🇯🇵 日本出口`[]🇺🇸 美国出口`[]🇭🇰 香港出口`[]🎯 全球直连`[]🧭 全部节点
custom_proxy_group=🎬 影音娱乐`select`[]📺 影音出口`[]🇯🇵 日本出口`[]🇸🇬 新加坡出口`[]🇺🇸 美国出口`[]🇭🇰 香港出口`[]🧭 全部节点
custom_proxy_group=🇬 谷歌与AI`select`[]🇺🇸 美国出口`[]🇸🇬 新加坡出口`[]🇯🇵 日本出口`[]🇭🇰 香港出口`[]🎯 全球直连`[]🧭 全部节点
custom_proxy_group=🐟 漏网之鱼`select`[]🇯🇵 日本出口`[]🇸🇬 新加坡出口`[]🇺🇸 美国出口`[]🇭🇰 香港出口`[]🎯 全球直连`[]🧭 全部节点
custom_proxy_group=🛠️ 系统与测速`select`[]🎯 全球直连`[]🇭🇰 香港出口`[]🇸🇬 新加坡出口`[]🇯🇵 日本出口`[]🇺🇸 美国出口`[]🧭 全部节点
custom_proxy_group=🔀 非标端口`select`[]🎯 全球直连`[]🐟 漏网之鱼
;出口层：fallback，手动模式切换和看门狗固定其中一条线路；该线路挂了内核自动顺延
custom_proxy_group=🇸🇬 新加坡出口`fallback`[]🇸🇬 新加坡·自建`[]🇸🇬 新加坡·链式`[]🇸🇬 新加坡·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇯🇵 日本出口`fallback`[]🇯🇵 日本·自建`[]🇯🇵 日本·链式`[]🇯🇵 日本·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇺🇸 美国出口`fallback`[]🇺🇸 美国·自建`[]🇺🇸 美国·链式`[]🇺🇸 美国·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇭🇰 香港出口`fallback`[]🇭🇰 香港·自建`[]🇭🇰 香港·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=📺 影音出口`fallback`[]🔙 送中`[]🇯🇵 日本出口`https://www.gstatic.com/generate_204`120
;线路层：自建=订阅里本地区全部自建节点（覆写按 HY2→V6→其余排序）；链式=机场前置→自建落地（落地由路由器私有覆写注入，
;未注入时临时指向本地区机场）；机场=排除自建后的机场节点（覆写改为 Smart，仅排除连不上落地的节点，保留送中和高倍率）
custom_proxy_group=🇸🇬 新加坡·自建`fallback`BEST.*新加坡`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇸🇬 新加坡·链式`fallback`[]🇸🇬 新加坡·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇸🇬 新加坡·机场`url-test`^(?!.*BEST).*新加坡`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇯🇵 日本·自建`fallback`BEST.*日本`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇯🇵 日本·链式`fallback`[]🇯🇵 日本·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇯🇵 日本·机场`url-test`^(?!.*BEST).*日本`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇺🇸 美国·自建`fallback`BEST.*美国`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇺🇸 美国·链式`fallback`[]🇺🇸 美国·机场`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇺🇸 美国·机场`url-test`^(?!.*BEST).*美国`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇭🇰 香港·自建`fallback`BEST.*香港`https://www.gstatic.com/generate_204`120
custom_proxy_group=🇭🇰 香港·机场`url-test`^(?!.*BEST).*香港`https://www.gstatic.com/generate_204`120
;送中：YouTube 判定为中国的节点，名单由路由器每天 05:30 测试后写入覆写；未测试前先用香港机场节点
custom_proxy_group=🔙 送中`url-test`^(?!.*BEST).*香港`https://www.gstatic.com/generate_204`120
custom_proxy_group=🧭 全部节点`select`(.*)
custom_proxy_group=🎯 全球直连`select`[]DIRECT
;设置分组标志位

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
